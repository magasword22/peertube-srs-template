listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# API HTTP de contrôle et négociation WebRTC
http_api {
    enabled         on;
    listen          1985;
}

# Serveur média WebRTC
# ⚠️ candidate : IP publique ou FQDN joignable par les clients WebRTC (UDP 8000)
rtc_server {
    enabled         on;
    listen          8000;
    candidate       your.public.ip.or.fqdn;
}

chunk_size 60000;

vhost __defaultVhost__ {
    # Optimisation temps réel et tolérance réseau
    tcp_nodelay     on;
    min_latency     on;
    in_ack_size 2500000;
    out_ack_size 2500000;

    publish {
        mr               off;
        firstpkt_timeout 20000;
        normal_timeout   30000;
    }

    # Transcodage à la volée vers PeerTube pour caler le flux à 30 fps
    transcode {
        enabled     on;
        ffmpeg      /usr/bin/ffmpeg;
        engine dji_fix {
            enabled         on;
            vcodec          libx264;
            vbitrate        1500;
            vfps            30;
            vwidth          0;
            vheight         0;
            vthreads        4;
            vprofile        baseline;
            vpreset         medium;
            vparams {
                tune        zerolatency;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            output          rtmp://peertube:1935/live/[stream];
        }
    }
    # Conversion WebRTC à chaud (retour direct écran de supervision)
    rtc {
        enabled     on;
        bframe      discard;
    }

    # HLS désactivé dans SRS (géré par PeerTube)
    hls {
        enabled     off;
    }
}
